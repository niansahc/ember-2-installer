appId: com.ember2.installer
productName: Ember Setup

publish:
  provider: github
  owner: niansahc
  repo: ember-2-installer
  # release-please publishes the GitHub Release immediately (draft: false in
  # release-please-config.json), so by the time release.yml runs, the release
  # already exists as a published one. electron-builder defaults to
  # releaseType: draft, finds existingType=release, and skips every upload
  # while still exiting 0 — which is how v0.18.0 shipped with zero assets and
  # no latest.yml. Pin the type so it uploads to the published release.
  releaseType: release

directories:
  output: C:/temp/ember-dist

files:
  - src/**/*
  - assets/**/*
  # Bundled into the asar root so get-release-notes (src/main.js) can read it in
  # packaged builds. Without this the "What's new" panel renders empty in every
  # shipped installer; it only works in dev because the repo-root file is present.
  - release_notes.html

win:
  target: nsis
  icon: assets/Ember2.ico
  signAndEditExecutable: false

mac:
  target: dmg
  icon: assets/Ember2.png

linux:
  target: AppImage
  icon: assets/Ember2.png
  category: Utility
  maintainer: niansahc <niansahc@gmail.com>

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  installerIcon: assets/Ember2.ico
  installerHeaderIcon: assets/Ember2.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  include: build/uninstaller.nsh
