name: Release

# Builds and publishes the installer for all three platforms when a GitHub
# Release is published. release-please creates the published release only when
# the human merges the release PR (draft: false in release-please-config.json),
# so this never cuts a release on its own — it stays human-gated.
#
# electron-builder --publish always attaches each platform's installer plus its
# latest*.yml (the file electron-updater reads to detect new versions); the
# publish target (github / niansahc / ember-2-installer) comes from
# electron-builder.yml.
#
# The installer is the Electron setup wizard ONLY. ember-2 (backend) and
# ember-2-ui (frontend) are cloned at the pinned tag (package.json
# emberRelease) and built on the user's machine at install time, so there is
# deliberately no frontend build step here; check-pinned-tags only confirms
# both tags exist.
#
# Artifacts are unsigned: the Windows .exe triggers SmartScreen and the macOS
# DMG is not notarized (Gatekeeper-blocked — right-click-open to run). Code
# signing is tracked separately. Linux in-app self-update is disabled in
# main.js, so the AppImage is a manual download.

on:
  release:
    types: [published]
  # Manual re-run lane. A `release` re-run checks out the release tag, so it
  # cannot pick up a fix landed on main after the tag was cut. Dispatching from
  # main builds the version in package.json and uploads to the existing release
  # for that version, which is how a release whose assets failed to attach gets
  # repaired without moving a published tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The installer clones ember-2 and ember-2-ui at tag v<emberRelease>
  # (package.json). A release pointing at a tag either repo lacks would ship an
  # installer whose every fresh install fails, so nothing is built until both
  # tags exist.
  check-pinned-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a pinned ember-2 or ember-2-ui tag is missing
        run: |
          tag="v$(node -p "require('./package.json').emberRelease")"
          for repo in ember-2 ember-2-ui; do
            # --exit-code: 2 means the repo answered without the tag; any other
            # failure means it could not be asked (network, DNS).
            status=0
            git ls-remote --exit-code --tags "https://github.com/niansahc/$repo.git" "refs/tags/$tag" || status=$?
            if [ "$status" -eq 2 ]; then
              echo "::error::package.json emberRelease names $tag, but niansahc/$repo has no such tag"
              exit 1
            elif [ "$status" -ne 0 ]; then
              echo "::error::could not reach niansahc/$repo to look for $tag (git ls-remote exited $status); re-run the job"
              exit 1
            fi
          done

  publish-windows:
    needs: check-pinned-tags
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build and publish Windows installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-mac:
    needs: check-pinned-tags
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build and publish macOS DMG
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing identity on CI — don't attempt to sign/notarize.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  publish-linux:
    needs: check-pinned-tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build and publish Linux AppImage
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
